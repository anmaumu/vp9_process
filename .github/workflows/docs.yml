name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen
          python -m pip install -r requirements-docs.txt
      - name: Validate documentation model
        run: python tools/docgen.py check
      - name: Validate stable C ABI
        run: python -m unittest tests/test_abi_guard.py
      - name: Validate language bindings
        run: python -m unittest tests/test_binding_guard.py
      - name: Test docgen
        run: python -m unittest tests/test_docgen.py
      - name: Validate source compliance manifest
        run: |
          python tools/compliance_gate.py source
          python -m unittest tests/test_compliance_gate.py tests/test_collect_licenses.py tests/test_build_wheel.py tests/test_build_nuget.py
      - name: Build HTML documentation
        run: python tools/docgen.py build
      - name: Upload generated documentation
        uses: actions/upload-artifact@v7
        with:
          name: mkvcodec-documentation
          path: build/docsite
          retention-days: 30
