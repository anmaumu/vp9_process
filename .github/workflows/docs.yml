name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Validate documentation model
        run: python tools/docgen.py check
      - name: Test docgen
        run: python -m unittest tests/test_docgen.py
      - name: Build HTML documentation
        run: python tools/docgen.py build
      - name: Upload generated documentation
        uses: actions/upload-artifact@v7
        with:
          name: mkvcodec-documentation
          path: build/docsite
          retention-days: 30

